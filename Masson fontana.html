<!DOCTYPE html>
<html>

<head>
    <title>Masson fontana spesialfarge</title>

    <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }

        h1 {
            color: #E75480;
        }

        h2 {
            margin-top: 60px;
        }

        .viewer {
            width: 90%;
            height: 500px;
            border: 1px solid lightgray;
            margin-top: 10px;
            background-color: white;
        }

        .back {
            margin-bottom: 30px;
        }

        .preview-image {
        width: 500px;
        height: 500px;
        object-fit: contain; 
        border: 1px solid lightgray;
        margin-top: 10px;
        display: block;
        cursor: pointer;
    }

/* Popup background */
.popup {
    display: none;
    position: fixed;
    z-index: 1000;
    padding-top: 40px;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    overflow: auto;
    background-color: rgba(0,0,0,0.9);
}

/* Popup image */
.popup-content {
    margin: auto;
    display: block;
    max-width: 90%;
    max-height: 90%;
}

/* Close button */
.close {
    position: absolute;
    top: 20px;
    right: 40px;
    color: white;
    font-size: 40px;
    font-weight: bold;
    cursor: pointer;
}
    
        .image-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.image-box {
    text-align: center;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.caption {
    margin-top: 8px;
    font-size: 14px;
    color: #555;
}

    </style>
</head>

<body>

<div class="back">
    <a href="index.html">← Tilbake til forsiden</a>
</div>

<h1>Masson Fontana</h1>

<p>Digitale histologibilder av snitt farget med Masson Fontana.</p>

<!-- HES -->

<h2>Masson fontana</h2>

<p>Frisk hud farget med Masson Fontana.</p>

    <div class="image-row">

    <div class="image-box">
        <img src="bilder/massonfontanahud.png" 
             alt="HES lever med portaltriader" 
             class="preview-image"
            onclick="openPopup(this.src)">

        <p class="caption">Hud. A: Melanocytter.</p>
    </div>
 </div>

<p>Malignt melanom farget med Masson Fontana.</p>
        
        <div class="image-row">

    <div class="image-box">
        <img src="bilder/massonfontanamaligntmelanom.png" 
             alt="HES lever med portaltriader" 
             class="preview-image"
            onclick="openPopup(this.src)">

        <p class="caption">Hud. A: Melanocytter dypt i dermis.</p>
    </div>
        
</div>

    <div id="imagePopup" class="popup">
    <span class="close" onclick="closePopup()">&times;</span>

    <img id="popupImg" class="popup-content">
</div>

<script>

function openPopup(src) {
    document.getElementById("imagePopup").style.display = "block";
    document.getElementById("popupImg").src = src;
}

function closePopup() {
    document.getElementById("imagePopup").style.display = "none";
}

</script>

</body>
</html>
