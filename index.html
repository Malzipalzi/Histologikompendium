<!DOCTYPE html>
<html>

<head>
    <title>Patologi-kompendium</title>

    <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            margin: 40px;
        }

        h1 {
            color: darkred;
        }

        h2 {
            margin-top: 60px;
        }

        .viewer {
            width: 100%;
            height: 500px;
            border: 1px solid lightgray;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>Lever</h1>

<p>Digitale histologibilder med zoom.</p>

<!-- HES -->

<h2>HES</h2>

<p>Beskrivelse av HES-farging.</p>

<div id="hes-viewer" class="viewer"></div>

<!-- PAS -->

<h2>PAS</h2>

<p>Beskrivelse av PAS-farging.</p>

<div id="pas-viewer" class="viewer"></div>

<!-- AB-PAS -->

<h2>AB-PAS</h2>

<p>Beskrivelse av AB-PAS-farging.</p>

<div id="abpas-viewer" class="viewer"></div>

<script>

OpenSeadragon({
    id: "hes-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "https://openseadragon.github.io/example-images/highsmith/highsmith.dzi"
});

OpenSeadragon({
    id: "pas-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "https://openseadragon.github.io/example-images/highsmith/highsmith.dzi"
});

OpenSeadragon({
    id: "abpas-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "https://openseadragon.github.io/example-images/highsmith/highsmith.dzi"
});

</script>

</body>
</html>
