<!DOCTYPE html>
<html>

<head>
    <title>Bukspyttkjertel</title>

    <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }

        h1 {
            color: #E75480;
        }

        h2 {
            margin-top: 60px;
        }

        .viewer {
            width: 100%;
            height: 500px;
            border: 1px solid lightgray;
            margin-top: 10px;
            background-color: white;
        }

        .back {
            margin-bottom: 30px;
        }

    </style>
</head>

<body>

<div class="back">
    <a href="index.html">← Tilbake til forsiden</a>

<h1>Bukspyttkjertel</h1>

<p>Digitale histologibilder av bukspyttkjertel.</p>

<!-- HES -->

<h2>HES</h2>

<p>Pancreas med langerhanske øyer.</p>

<div id="pancreashes-viewer" class="viewer"></div>

<!-- PAS -->

<h2>PAS</h2>

<p>Beskrivelse av PAS-farging.</p>

<div id="pas-viewer" class="viewer"></div>

<!-- AB-PAS -->

<h2>AB-PAS</h2>

<p>Beskrivelse av AB-PAS-farging.</p>

<div id="abpas-viewer" class="viewer"></div>

<script>

OpenSeadragon({
    id: "pancreashes-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "bilder/pancreashes.dzi"
});

OpenSeadragon({
    id: "pas-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "https://openseadragon.github.io/example-images/highsmith/highsmith.dzi"
});

OpenSeadragon({
    id: "abpas-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",

});

</script>
