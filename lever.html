<!DOCTYPE html>
<html>

<head>
    <title>Lever</title>

    <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }

        h1 {
            color: #E75480;
        }

        h2 {
            margin-top: 60px;
        }

        .viewer {
            width: 100%;
            height: 500px;
            border: 1px solid lightgray;
            margin-top: 10px;
            background-color: white;
        }

        .back {
            margin-bottom: 30px;
        }

        .preview-image {
        width: 300px;
        max-width: 100%;
        border: 1px solid lightgray;
        margin-top: 10px;
        display: block;
    }
        .image-row {
    display: flex;
    gap: 20px;
    flex-wrap: wrap;
    margin-top: 10px;
}

.image-box {
    text-align: center;
}

.caption {
    margin-top: 8px;
    font-size: 14px;
    color: #555;
}

    </style>
</head>

<body>

<div class="back">
    <a href="index.html">← Tilbake til forsiden</a>
</div>

<h1>Lever</h1>

<p>Digitale histologibilder av lever.</p>

<!-- HES -->

<h2>HES</h2>

<p>Frisk lever, med portaltriader og sentralvener.</p>

    <div class="image-row">

    <div class="image-box">
        <img src="bilder/leverhesportal.png" 
             alt="HES lever med portaltriader" 
             class="preview-image">

        <p class="caption">Portaltriade i frisk lever. A: Portalvene. B: Portarterie. C: Galleductus. D: Sinusoide. E: Hepatocytter. F: Kuphercelle.</p>
    </div>

    <div class="image-box">
        <img src="bilder/leverhessentralvene.png" 
             alt="Portalområde lever" 
             class="preview-image">

        <p class="caption">Sentralvene.</p>
    </div>

</div>

<div id="hes-viewer" class="viewer"></div>

<!-- PAS -->

<h2>HES</h2>

<p>Viser fettlever.</p>

<div id="pas-viewer" class="viewer"></div>


<script>

OpenSeadragon({
    id: "hes-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "bilder/leverfriskhes.dzi"
});

OpenSeadragon({
    id: "pas-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "bilder/fettlever.dzi"
});


</script>

</body>
</html>
