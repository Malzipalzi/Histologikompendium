<!DOCTYPE html>
<html>

<head>
    <title>Lever</title>

    <script src="https://openseadragon.github.io/openseadragon/openseadragon.min.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            margin: 40px;
            background-color: #f7f7f7;
        }

        h1 {
            color: #E75480;
        }

        h2 {
            margin-top: 60px;
        }

        .viewer {
            width: 100%;
            height: 500px;
            border: 1px solid lightgray;
            margin-top: 10px;
            background-color: white;
        }

        .back {
            margin-bottom: 30px;
        }

        .preview-image {
        width: 300px;
        max-width: 100%;
        border: 1px solid lightgray;
        margin-top: 10px;
        display: block;
    }

    </style>
</head>

<body>

<div class="back">
    <a href="index.html">← Tilbake til forsiden</a>
</div>

<h1>Lever</h1>

<p>Digitale histologibilder av lever.</p>

<!-- HES -->

<h2>HES</h2>

<p>Frisk lever, med portaltriader og sentralvener.</p>

    <img src="bilder/leverhesportal.jpg" alt="HES lever med portaltriader" class="preview-image">

<div id="hes-viewer" class="viewer"></div>

<!-- PAS -->

<h2>HES</h2>

<p>Viser fettlever.</p>

<div id="pas-viewer" class="viewer"></div>


<script>

OpenSeadragon({
    id: "hes-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",
    tileSources: "bilder/leverfriskhes.dzi"
});

OpenSeadragon({
    id: "pas-viewer",
    prefixUrl: "https://openseadragon.github.io/openseadragon/images/",

});


</script>
